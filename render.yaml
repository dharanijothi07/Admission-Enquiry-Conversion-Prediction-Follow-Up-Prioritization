services:
  # 1. Frontend: High-performance Static Site (Free tier on Render)
  - type: web
    name: admission-intelligence-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend: Python FastAPI Microservice
  - type: web
    name: admission-intelligence-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./admission_intelligence_demo.db
      - key: CORS_ORIGINS
        value: '*'
